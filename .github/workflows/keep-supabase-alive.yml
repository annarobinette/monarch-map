name: Keep Supabase project alive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This pings a public read-only endpoint on a schedule so the project stays active.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://bjdlyjjgidscwiwoecfa.supabase.co/rest/v1/houses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 300 ]; then
            echo "Unexpected status code from Supabase" >&2
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqZGx5ampnaWRzY3dpd29lY2ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzM2MDMsImV4cCI6MjA5ODY0OTYwM30.Xbyxd7MGzsx-MHQieyLZWLwXVwkmLIry6XcWOqf5VPc
